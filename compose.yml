services:
  lnurl-oidc-bridge:
    image: thespielplatz/lnurl-oidc-bridge:latest
    container_name: lnurl-oidc-bridge
    restart: unless-stopped
    # The only persistent state is the RS256 signing key: it's generated on
    # first boot into the mounted ./data volume and reused on every restart,
    # so issued tokens keep verifying. (Challenges + codes stay in memory.)
    volumes:
      - ./data:/app/data
    environment:
      - OIDC_PRIVATE_KEY_FILE=/app/data/signing.pem
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.lnurl-oidc-bridge.rule=Host(`lnurl-oidc-bridge.example.domain`)"
      - "traefik.http.routers.lnurl-oidc-bridge.tls.certresolver=resolver"
      - "traefik.http.services.lnurl-oidc-bridge.loadbalancer.server.port=3000"
    env_file:
      - .env          # path is relative to the compose file
    # OIDC_ISSUER in .env MUST equal https://<the Host rule above>,
    # e.g. OIDC_ISSUER=https://lnurl-oidc-bridge.example.domain
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000/jwks.json').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  default:
    external: true
    name: traefik-network
