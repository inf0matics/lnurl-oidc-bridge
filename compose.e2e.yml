# Integration test harness: the real bridge image + a mock Logto-style OIDC
# relying party, wired together. Driven by `npm run test:integration`.
#
# Issuer note: the ID token's `iss` is the browser-facing bridge URL
# (http://localhost:3010). The mock RP makes its back-channel /token and
# /jwks.json calls over the docker network (http://bridge:3000) but verifies
# the issuer string against the public URL — the two are independent.
services:
  bridge:
    build: .
    # NODE_ENV=production comes from the image, so this also exercises the
    # production key path: a key is generated into /tmp on first boot.
    environment:
      - OIDC_ISSUER=http://localhost:3010
      - OIDC_PRIVATE_KEY_FILE=/tmp/signing.pem
      - OIDC_CLIENT_ID=mock-logto
      - OIDC_CLIENT_SECRET=mock-secret
      - OIDC_REDIRECT_URIS=http://localhost:3011/callback
    ports:
      - "3010:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000/jwks.json').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 3s
      timeout: 3s
      retries: 15

  mock-rp:
    build: ./tests/mock-rp
    environment:
      - PORT=3000
      - BRIDGE_PUBLIC_URL=http://localhost:3010
      - BRIDGE_INTERNAL_URL=http://bridge:3000
      - RP_PUBLIC_URL=http://localhost:3011
      - CLIENT_ID=mock-logto
      - CLIENT_SECRET=mock-secret
    ports:
      - "3011:3000"
    depends_on:
      bridge:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 3s
      timeout: 3s
      retries: 15
